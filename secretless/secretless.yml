version: "2"
services:
  billing-db:
    connector: pg
    listenOn: tcp://0.0.0.0:5432
    credentials:
      host:
        from: conjur
        get: prod/billing-app/db/host
      port:
        from: conjur
        get: prod/billing-app/db/port
      username:
        from: conjur
        get: prod/billing-app/db/username
      password:
        from: conjur
        get: prod/billing-app/db/password
      sslmode: disable
